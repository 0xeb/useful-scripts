name: upyscripts

on:
  workflow_dispatch:
  push:
    paths:
      - "upyscripts/**"
      - ".github/workflows/upyscripts.yml"
  pull_request:
    paths:
      - "upyscripts/**"
      - ".github/workflows/upyscripts.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: upyscripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check upyscripts tests
      - run: python -m compileall -q upyscripts
      - run: pytest -q --ignore=tests/test_qslideshow_playwright_basic.py --ignore=tests/test_qslideshow_playwright_timer.py
      - name: Smoke test console entry points
        run: |
          python - <<'PY'
          import importlib.metadata
          import importlib

          for entry_point in importlib.metadata.entry_points(group="console_scripts"):
              if entry_point.name.startswith("upy."):
                  module = importlib.import_module(entry_point.module)
                  assert hasattr(module, entry_point.attr), entry_point.name
          PY

  chromium:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: upyscripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/test_qslideshow_playwright_basic.py tests/test_qslideshow_playwright_timer.py --browser chromium

  windows-rrepl:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        working-directory: upyscripts
    env:
      RREPL_URL: ${{ secrets.RREPL_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,rrepl-dbg]"
      - run: pytest -q tests/test_rrepl_dbg_remote.py -rs
